allowBuilds:
  esbuild: true ## Required by Vite to install the platform-specific esbuild binary used during bundling
  msgpackr-extract: true ## Required by effect -> msgpackr on pnpm 11+, including CI installs
  sharp: false ## Install script is only required when compiling sharp from source - https://sharp.pixelplumbing.com/install

minimumReleaseAgeExclude:
  - '@effect/platform-node-shared@4.0.0-beta.105'
  - '@effect/platform-node@4.0.0-beta.105'
  - effect@4.0.0-beta.105

nodeLinker: isolated

packages:
  - cli
